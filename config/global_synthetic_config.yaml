regions:
  NA:
    name: North America
    countries: [US, CA, MX]
    behavior_multiplier: 1.2
  EU:
    name: Europe
    countries: [DE, FR, UK]
    behavior_multiplier: 0.9
  SSA:
    name: Sub-Saharan Africa
    countries: [NG, ZA, KE]
    behavior_multiplier: 0.7
  ME:
    name: Middle East
    countries: [SA, AE, IL]
    behavior_multiplier: 1.1
  SA:
    name: South Asia
    countries: [IN, PK, BD]
    behavior_multiplier: 0.8
  EA:
    name: East Asia
    countries: [CN, JP, KR]
    behavior_multiplier: 1.3
  LA:
    name: Latin America
    countries: [BR, AR, MX]
    behavior_multiplier: 1.0

# Domain-specific overrides. Previously these were wrongly nested under
# `regions:`, which made the orchestrator treat them as bogus regions.
domains:
  finance: {}
  ngo: {}
  telecom: {}
  traffic: {}

output:
  format: jsonl
  path: data/synthetic_output
  partition_by: [region, domain]

seed: 42

hitl:
  enabled: true
  review_fraction: 0.05
  override_thresholds: {}

streaming:
  enabled: false
  batch_ms: 1000
