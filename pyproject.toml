[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "profile_system"
version = "0.2.0"
description = "Intelligent Profiling Engine: unsupervised ML + NLP + HITL feedback."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Bucky Ops" }]
keywords = ["profiling", "ml", "nlp", "anomaly-detection", "hitl"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "scikit-learn>=1.3,<2",
    "pandas>=2.0,<3",
    "numpy>=1.24,<3",
    "matplotlib>=3.7,<4",
    "spacy>=3.7,<4",
    "textblob>=0.17,<1",
    "sentence-transformers>=2.2,<4",
    "PyYAML>=6.0,<7",
    "Faker>=20.0,<30",
    "streamlit>=1.30,<2",
]

[project.optional-dependencies]
# Streamlit web app, Tkinter GUI, CLI - everything needed to run the
# interfaces out of the box.
gui = ["matplotlib>=3.7,<4"]
# Optional Spark Parquet writer.
spark = ["pyspark>=3.4,<4", "pyarrow>=12.0,<26"]
# Dev / test tooling.
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "pytest-benchmark>=4.0",
    "ruff>=0.4",
    "black>=24.3",
    "mypy>=1.8",
    "pip-audit>=2.7",
    "bandit>=1.7",
    "pre-commit>=3.6",
]
docs = ["mkdocs>=1.5", "mkdocs-material>=9.5", "mkdocstrings[python]>=0.24"]

[project.urls]
Homepage = "https://github.com/bucky-ops/intelligent-profiling-engine"
Repository = "https://github.com/bucky-ops/intelligent-profiling-engine"
Issues = "https://github.com/bucky-ops/intelligent-profiling-engine/issues"

[project.scripts]
profile-system = "profile_system.cli:ProfileSystemCLI.run"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --cov=src/profile_system --cov-report=term-missing"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "C4", "SIM"]
ignore = ["E501"]  # line length handled by black

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.mypy]
python_version = "3.9"
strict = false
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.coverage.run]
source = ["src/profile_system"]
omit = ["*/tests/*"]
